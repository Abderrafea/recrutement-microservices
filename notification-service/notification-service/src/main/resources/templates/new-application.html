<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New job application</title>
</head>
<body style="margin:0;padding:0;background:#f8fafc;font-family:Arial,sans-serif;color:#111827;">
<table role="presentation" width="100%" style="padding:32px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="620" style="background:#ffffff;border-radius:20px;padding:32px;box-shadow:0 18px 44px rgba(15,23,42,0.08);">
                <tr>
                    <td>
                        <div style="font-size:13px;letter-spacing:2px;text-transform:uppercase;color:#059669;font-weight:700;">New Application</div>
                        <h1 style="margin:16px 0 12px;font-size:30px;">A candidate just applied.</h1>
                        <p style="font-size:16px;line-height:1.7;margin:0 0 18px;"><strong th:text="${candidateName}">Candidate</strong> submitted an application for <strong th:text="${jobTitle}">Job Title</strong> at <strong th:text="${company}">Company</strong>.</p>
                        <p style="font-size:15px;line-height:1.7;margin:0;">Open your employer dashboard to review the profile and move the application to the next stage.</p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
