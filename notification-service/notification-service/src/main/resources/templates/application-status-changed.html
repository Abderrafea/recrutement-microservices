<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Application status updated</title>
</head>
<body style="margin:0;padding:0;background:#f7fafc;font-family:Arial,sans-serif;color:#0f172a;">
<table role="presentation" width="100%" style="padding:32px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="620" style="background:#ffffff;border-radius:20px;padding:32px;box-shadow:0 18px 44px rgba(15,23,42,0.08);">
                <tr>
                    <td>
                        <div style="display:inline-block;padding:8px 14px;border-radius:999px;background:#dbeafe;color:#1d4ed8;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;">Status update</div>
                        <h1 style="margin:16px 0 12px;font-size:28px;">Your application moved forward</h1>
                        <p style="font-size:16px;line-height:1.7;margin:0 0 18px;">Your application for <strong th:text="${jobTitle}">Job Title</strong> at <strong th:text="${company}">Company</strong> is now marked as <strong th:text="${status}">REVIEWED</strong>.</p>
                        <p style="font-size:15px;line-height:1.7;margin:0;">Keep an eye on your dashboard for the latest updates.</p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
