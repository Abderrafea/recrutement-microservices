spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

storage:
  cv-directory: ${APP_CV_STORAGE_DIR:uploads/applications/cv}
